name: Publish BLBUI packages

on:
  push:
    tags:
      - "blbui-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack without publishing to npm"
        required: false
        default: true
        type: boolean
      publish_mode:
        description: "Authentication mode for a real publish"
        required: false
        default: token
        type: choice
        options:
          - token
          - oidc

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-blbui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and build packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install package workspace
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: .
        run: bunx playwright install --with-deps chromium

      - name: Check catalog, public API, themes and tokens
        working-directory: .
        run: bun run catalog:check && bun run business:examples:check && bun run api:check && bun run theme:check && bun run token:check && bun run governance:check && bun run visual:check && bun run visual:golden:check && bun run examples:check && bun run migration:check

      - name: Check release metadata
        working-directory: .
        run: bun run release:preflight

      - name: Typecheck package workspace
        working-directory: .
        run: bun run typecheck

      - name: Check formatting
        working-directory: .
        run: bun run format:check

      - name: Check API documentation
        working-directory: .
        run: bun run api:check

      - name: Build publish artifacts
        working-directory: .
        run: bun run build:packages

      - name: Check release metadata and npm availability
        working-directory: .
        env:
          BLBUI_CHECK_NPM: "1"
        run: bun run release:preflight

      - name: Check SSR and framework bindings
        working-directory: .
        run: bun run ssr:check && bun run test:frameworks

      - name: Check Svelte components
        # Runs after the build: the dist/src export-sync verification in
        # check-svelte.mjs needs the generated svelte dist.
        working-directory: .
        run: bun run check:svelte

      - name: Build documentation site
        working-directory: .
        run: bun run docs:check

      - name: Run test suite
        working-directory: .
        run: bun run test

      - name: Run browser quality gate
        working-directory: .
        run: bun run e2e:check

      - name: Pack all public packages
        working-directory: .
        run: |
          set -euo pipefail
          for package in core react vue svelte business business-react; do
            echo "--- npm pack $package ---"
            (cd "$package" && npm pack --dry-run --json) > "/tmp/blbui-$package-pack.json"
          done

  publish:
    name: Publish packages to npm
    needs: validate
    if: github.event_name == 'push' || inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install package workspace
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Build publish artifacts
        working-directory: .
        run: bun run build:packages

      - name: Publish packages in dependency order
        working-directory: .
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          BLBUI_PUBLISH_MODE: ${{ inputs.publish_mode || 'token' }}
        run: |
          set -euo pipefail
          if [ "$BLBUI_PUBLISH_MODE" = "oidc" ]; then
            echo "Using npm Trusted Publishing / OIDC; each package must trust this repository and workflow."
            npm_version="$(npm --version)"
            node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)' "$npm_version" || { echo "npm >= 11.5.1 is required for OIDC trusted publishing (found $npm_version)"; exit 1; }
            unset NODE_AUTH_TOKEN
          else
            test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN repository/environment secret is required for token publishing"; exit 1; }
          fi
          for package in core react vue svelte business business-react; do
            echo "--- npm publish $package ---"
            (cd "$package" && npm publish --access public --provenance --ignore-scripts)
          done

      - name: Verify npm publication visibility and write summary
        working-directory: .
        env:
          BLBUI_NPM_VERIFY_TIMEOUT_MS: "600000"
          BLBUI_NPM_VERIFY_INTERVAL_MS: "10000"
          BLBUI_NPM_REQUEST_TIMEOUT_MS: "15000"
        run: bun run npm:verify
